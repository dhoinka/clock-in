name: Build, Test and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clock-in/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test API
        working-directory: api
        run: ./gradlew test

      - name: Build API image
        working-directory: api
        run: ./gradlew bootBuildImage --imageName=${IMAGE}:latest

      - name: Publish API image
        run: |
          docker tag ${IMAGE}:latest ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clock-in/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm run test -- --watch=false

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - api
      - web

    steps:
      - name: Clean up old API images
        uses: actions/delete-package-versions@v5
        with:
          package-name: clock-in/api
          package-type: container
          min-versions-to-keep: 3

      - name: Clean up old web images
        uses: actions/delete-package-versions@v5
        with:
          package-name: clock-in/web
          package-type: container
          min-versions-to-keep: 3
