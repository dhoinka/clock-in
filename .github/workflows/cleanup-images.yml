name: Clean Up Container Images

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Clean up old API images
        uses: actions/delete-package-versions@v5
        with:
          package-name: clock-in/api
          package-type: container
          min-versions-to-keep: 3

      - name: Clean up old web images
        uses: actions/delete-package-versions@v5
        with:
          package-name: clock-in/web
          package-type: container
          min-versions-to-keep: 3
