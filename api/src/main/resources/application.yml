spring:
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt-secret: ${APP_JWT_SECRET:development-only-dummy-jwt-secret-change-before-deployment-0123456789abcdef}
  access-token-lifetime: ${APP_ACCESS_TOKEN_LIFETIME:PT15M}
  reset-token-lifetime: ${APP_ACCESS_TOKEN_LIFETIME:PT15M}
  refresh-token-lifetime: ${APP_REFRESH_TOKEN_LIFETIME:P7D}
  refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
