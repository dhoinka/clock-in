<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-background to-muted p-4"
>
  <z-card zTitle="Forgot Password" class="w-full max-w-md shadow-2xl">
    <div class="text-center pb-4">
      <img
        src="/assets/logo-gloomstone-invert-sm.svg"
        width="200"
        height="50"
        alt="gloomstone logo"
        class="mx-auto mb-4"
      />
    </div>
    <div class="space-y-4">
      @if (!submitted()) {
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <p class="text-sm text-muted-foreground">
            Enter your email address and we'll send you a link to reset your
            password.
          </p>
          <div class="space-y-2">
            <z-form-label for="email">Email address</z-form-label>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm"
            />
          </div>

          @if (error()) {
            <p class="text-sm text-destructive">{{ error() }}</p>
          }

          <button z-button type="submit" zFull [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Sending...' : 'Send Reset Link' }}
          </button>

          <div class="text-center">
            <a
              routerLink="/login"
              class="text-sm text-muted-foreground hover:text-primary"
            >
              Back to login
            </a>
          </div>
        </form>
      } @else {
        <div class="text-center space-y-4">
          <p class="text-sm text-muted-foreground">
            If an account exists with that email, you'll receive a reset link
            shortly.
          </p>
          <a routerLink="/login" class="text-sm text-primary hover:underline">
            Back to login
          </a>
        </div>
      }
    </div>
  </z-card>
</div>
