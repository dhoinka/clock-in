<p class="mb-4 text-sm text-muted-foreground">
  Dates are inclusive: an event from the 3rd to the 5th is shown on all three
  days.
</p>

@if (error()) {
  <p class="mb-4 text-sm text-destructive" role="alert">{{ error() }}</p>
}

<div class="space-y-4">
  <div class="space-y-2">
    <z-form-label for="booking-event-title">Title</z-form-label>
    <input
      id="booking-event-title"
      type="text"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm"
      placeholder="e.g. Annual leave"
      [disabled]="saving()"
      required
    />
  </div>

  <div class="space-y-2">
    <z-form-label for="booking-event-type">Type</z-form-label>
    <select
      id="booking-event-type"
      [ngModel]="type()"
      (ngModelChange)="setType($event)"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm"
      [disabled]="saving()"
    >
      <option value="vacation">Vacation</option>
      <option value="sick">Sick</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="space-y-2">
      <z-form-label for="booking-event-start">Start date</z-form-label>
      <input
        id="booking-event-start"
        type="date"
        [ngModel]="startDate()"
        (ngModelChange)="startDate.set($event)"
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm"
        [disabled]="saving()"
        required
      />
    </div>
    <div class="space-y-2">
      <z-form-label for="booking-event-end">End date</z-form-label>
      <input
        id="booking-event-end"
        type="date"
        [ngModel]="endDate()"
        (ngModelChange)="endDate.set($event)"
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm"
        [disabled]="saving()"
        required
      />
    </div>
  </div>
</div>

<div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-between">
  @if (data.event?.id) {
    <button
      z-button
      zType="destructive"
      type="button"
      [disabled]="saving()"
      (click)="delete()"
    >
      Delete event
    </button>
  }
  <div class="flex flex-col-reverse gap-2 sm:ml-auto sm:flex-row sm:space-x-2">
    <button
      z-button
      zType="outline"
      type="button"
      [disabled]="saving()"
      (click)="close()"
    >
      Cancel
    </button>
    <button z-button type="button" [disabled]="saving()" (click)="save()">
      {{ saving() ? 'Saving…' : 'Save event' }}
    </button>
  </div>
</div>
